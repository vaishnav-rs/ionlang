<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="How Ion runs: script to parser to interpreter to agents to providers, with chat, API and editor on the side">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <style>
      .box { fill: url(#card); stroke: #7c3aed; stroke-width: 1.5; }
      .label { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #e2e8f0; font-size: 19px; font-weight: 700; }
      .sub { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #94a3b8; font-size: 14px; }
      .flow { stroke: #a78bfa; stroke-width: 2.2; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; animation: march 1.6s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -28; } }
    </style>
  </defs>
  <rect width="1100" height="430" rx="22" fill="#0b1020"/>

  <!-- the main path, left to right -->
  <rect class="box" x="30" y="165" width="180" height="100" rx="14"/>
  <text class="label" x="120" y="205" text-anchor="middle">Your script</text>
  <text class="sub" x="120" y="232" text-anchor="middle">.ion, plain English</text>

  <path class="flow" d="M 214 215 L 262 215"/>
  <rect class="box" x="266" y="165" width="180" height="100" rx="14"/>
  <text class="label" x="356" y="205" text-anchor="middle">Parser + checker</text>
  <text class="sub" x="356" y="232" text-anchor="middle">errors before anything runs</text>

  <path class="flow" d="M 450 215 L 498 215"/>
  <rect class="box" x="502" y="165" width="180" height="100" rx="14"/>
  <text class="label" x="592" y="205" text-anchor="middle">Interpreter</text>
  <text class="sub" x="592" y="232" text-anchor="middle">runs your code</text>

  <path class="flow" d="M 686 215 L 734 215"/>
  <rect class="box" x="738" y="165" width="150" height="100" rx="14"/>
  <text class="label" x="813" y="205" text-anchor="middle">Agents</text>
  <text class="sub" x="813" y="232" text-anchor="middle">tools, teams, memory</text>

  <path class="flow" d="M 892 215 L 940 215"/>
  <rect class="box" x="944" y="165" width="146" height="100" rx="14"/>
  <text class="label" x="1017" y="205" text-anchor="middle">Any model</text>
  <text class="sub" x="1017" y="232" text-anchor="middle">Gemini, GPT, Claude</text>

  <!-- guards that sit under the agents -->
  <rect x="738" y="296" width="150" height="58" rx="12" fill="#0f172a" stroke="#f0abfc" stroke-width="1.2"/>
  <text class="sub" x="813" y="320" text-anchor="middle" fill="#f0abfc">asks before risky</text>
  <text class="sub" x="813" y="340" text-anchor="middle" fill="#f0abfc">and writes an audit log</text>
  <path d="M 813 265 L 813 294" stroke="#f0abfc" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>

  <!-- ways in, above the line -->
  <rect x="502" y="40" width="180" height="78" rx="12" fill="#0f172a" stroke="#334155"/>
  <text class="label" x="592" y="72" text-anchor="middle" font-size="16">Chat page · API</text>
  <text class="sub" x="592" y="96" text-anchor="middle">ion run / ion preview</text>
  <path d="M 592 118 L 592 163" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="266" y="40" width="180" height="78" rx="12" fill="#0f172a" stroke="#334155"/>
  <text class="label" x="356" y="72" text-anchor="middle" font-size="16">Editor</text>
  <text class="sub" x="356" y="96" text-anchor="middle">errors and completions</text>
  <path d="M 356 118 L 356 163" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- tests and the run log, below -->
  <rect x="30" y="330" width="420" height="66" rx="12" fill="#0f172a" stroke="#334155"/>
  <text class="label" x="240" y="360" text-anchor="middle" font-size="16">ion test</text>
  <text class="sub" x="240" y="382" text-anchor="middle">runs your test blocks with the offline mock model</text>
</svg>
